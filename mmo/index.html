<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Single-Player MMO</title>
<meta name="apple-mobile-web-app-title" content="MMO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0b0a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: an old-school MMO a century after the summoner wars; plain, a little wry
   PICTURE: the world owns the screen; frames and the bar are small dark plates at the edges
   COLOUR and TYPE: night slate plates, parchment ink, class colours as accents; Cinzel + Alegreya Sans */
:root{color-scheme:dark;--bg:#11161a;--ink:#eee4cc;--dim:#b3a891;--acc:#e0b040;--plate:rgba(14,18,21,.74);--line:rgba(238,228,204,.16);--good:#9be36b;--bad:#ff5a48;
  --hp:#d9544a;--mana:#4fb0e8;--rage:#d04a2a;--focus:#e8c040;
  --st:max(6px,env(safe-area-inset-top));--sb:max(8px,env(safe-area-inset-bottom));--sl:max(6px,env(safe-area-inset-left));--sr:max(6px,env(safe-area-inset-right));
  --key:42px;--barH:calc(var(--key)*2 + 4px)}
@media(min-aspect-ratio:4/3){:root{--key:40px;--barH:var(--key)}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.3 "Alegreya Sans",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block}
body>canvas{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(10,6,4,.4))}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 55%,rgba(200,30,20,.45));opacity:0;transition:opacity .25s}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:9px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
button{font:600 14px "Alegreya Sans",sans-serif;color:var(--ink);background:rgba(238,228,204,.08);border:1px solid var(--line);border-radius:9px;min-height:38px;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4}
button.pri{background:var(--acc);color:#1a1208;border-color:var(--acc)}
.bar{position:relative;height:7px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .12s}
.bar.thin{height:3px}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:9px;text-align:center;text-shadow:0 0 2px #000,0 0 2px #000;font-weight:700}
.bar.tall{height:9px}.bar.tall span{line-height:9px;font-size:8.5px}

/* unit frames */
#me{position:fixed;top:var(--st);left:var(--sl);width:146px;padding:3px 6px}
.fname{display:flex;justify-content:space-between;gap:4px;font:700 11px Cinzel,serif;white-space:nowrap}
.fname b{overflow:hidden;text-overflow:ellipsis}
.fname small{font:600 10px "Alegreya Sans";color:var(--dim)}
#me .bar{margin-top:2px}
#buffs{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}#buffs:empty{display:none}
#buffs span{font-size:11px;line-height:15px;border-radius:4px;background:rgba(255,255,255,.08);padding:0 2px}
#party{position:fixed;top:calc(var(--st) + 56px);left:var(--sl);width:112px;display:flex;flex-direction:column;gap:2px}
.pf{position:relative;padding:2px 5px 3px;cursor:pointer;border-left:3px solid var(--c);border-radius:7px}
.pf .fname{font-size:9.5px}
.pf .bar{margin-top:1px;height:5px}.pf .bar.thin{height:2px;margin-top:1px}
.pf.dead{opacity:.45}.pf.sel{box-shadow:0 0 0 2px #fff}
.pf .cast{position:absolute;right:4px;top:2px;font-size:10px;color:var(--acc)}
.pf .aggro{position:absolute;right:-6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
#cmds{display:flex;gap:2px;margin-top:2px;width:150px}#cmds button{flex:1;min-height:24px;padding:0 2px;font-size:9.5px;background:var(--plate)}#cmds button.on{background:var(--acc);color:#1a1208}

#mapbox{position:fixed;top:var(--st);right:var(--sr);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#mini{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:#222;cursor:pointer}
#breath{position:fixed;left:50%;top:calc(var(--st) + 52px);transform:translateX(-50%);width:160px;height:12px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid #5fb8ff;overflow:hidden;z-index:6;pointer-events:none}#breath i{display:block;height:100%;background:linear-gradient(#8fd8ff,#3a8ad8);width:100%}#breath span{position:absolute;inset:0;text-align:center;font:700 9px Cinzel,serif;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
#zone{font:700 9.5px Cinzel,serif;color:var(--dim);text-shadow:0 1px 2px #000;max-width:110px;text-align:right}
#mapbtns{display:flex;gap:4px}#mapbtns button{min-height:26px;padding:0 8px;font-size:11px;background:var(--plate)}
#mapbtns button[data-n]::after{content:attr(data-n);margin-left:4px;background:#e04a2a;color:#fff;border-radius:7px;padding:0 4px;font-size:10px}

#tgt{position:fixed;top:calc(var(--st) + 112px);right:var(--sr);width:150px;padding:3px 6px}
#tgtX{position:absolute;top:-8px;right:-8px;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;font-size:12px;line-height:1;background:#2a2f34;border:1px solid var(--line)}
#tgt .bar{margin-top:3px}
#tgtSub{display:flex;flex-wrap:wrap;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:2px;column-gap:6px}
#tgtCast{margin-top:3px}#tgtCast i{background:#c08aff}
#tot{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tgtBtns{display:flex;gap:4px;margin-top:4px}#tgtBtns:empty{display:none}#tgtBtns button{flex:1;min-height:26px;font-size:11px;padding:0 4px}
#threat{margin-top:5px;border-top:1px solid var(--line);padding-top:3px}#threat:empty{display:none}
.th{display:grid;grid-template-columns:1fr 30px;column-gap:4px;font-size:9.5px;line-height:1.15;align-items:center}
.th .bar{height:3px;margin:0 0 2px}.th b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.me b{color:#fff;font-weight:700}.th.hot{animation:hot .5s infinite alternate}
@keyframes hot{to{color:var(--bad)}}
#track{position:fixed;right:var(--sr);width:150px;font-size:10px;line-height:1.3;text-align:right;color:var(--dim);text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
#track b{color:var(--acc);font-weight:700}

@media(min-aspect-ratio:4/3){#tgt{top:var(--st);right:auto;left:50%;transform:translateX(-50%);width:200px}#party{top:calc(var(--st) + 56px)}}

/* bottom: chat, utility buttons, the bar */
#chat{position:fixed;right:var(--sr);bottom:calc(var(--sb) + var(--barH) + 46px);width:min(220px,54vw);display:flex;flex-direction:column;gap:1px;pointer-events:none;font-size:10.5px;line-height:1.25;text-shadow:0 1px 2px #000,0 0 3px #000}
#chat div{transition:opacity 1s}#chat .old{opacity:0}
.ch-sys{color:#ffe08a}.ch-party{color:#8fd0ff}.ch-gen{color:#e8d8c0}.ch-loot{color:#9be36b}.ch-say{color:#ffb0a0}.ch-whisper{color:#ff9ae6}.ch-guild{color:#7fe8a0}
#chat b{font-weight:700}
#util{position:fixed;right:var(--sr);bottom:calc(var(--sb) + var(--barH) + 8px);display:flex;gap:5px}
#util button{min-height:30px;min-width:34px;padding:0 6px;font-size:13px;background:var(--plate);position:relative}
#util button small{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:700}
#util button .cd{position:absolute;inset:0;border-radius:9px;background:rgba(0,0,0,.55)}
#act{position:fixed;left:var(--sl);bottom:calc(var(--sb) + var(--barH) + 48px);font-size:13px!important;min-height:34px!important;min-height:40px;font-size:15px;background:var(--acc);color:#1a1208;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#castbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + var(--barH) + 100px);width:200px;padding:3px 6px;text-align:center;font-size:11.5px}
#castbar .bar{margin-top:2px}#castbar i{background:var(--acc)}
#xp{position:fixed;left:var(--sl);right:var(--sr);bottom:calc(var(--sb) + var(--barH) + 3px);height:3px}
#xp i{background:#b884ff}
#hot{position:fixed;left:var(--sl);right:var(--sr);bottom:var(--sb);display:flex;gap:5px;justify-content:center}
#cycle{width:40px;height:var(--barH);min-height:0;padding:0;font-size:16px;line-height:1;background:var(--plate);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#cycle small{font-size:8.5px;color:var(--dim)}
#keys{display:grid;grid-template-columns:repeat(6,var(--key));grid-auto-rows:var(--key);gap:5px}
@media(min-aspect-ratio:4/3){#keys{grid-template-columns:repeat(12,var(--key))}}
.k{position:relative;width:var(--key);height:var(--key);min-height:0;padding:0;border-radius:10px;border:2px solid var(--c,#555);background:var(--plate);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.k.empty{border-style:dashed;opacity:.35}
.k.no{filter:grayscale(.85) brightness(.6)}
.k.oor::after{content:"";position:absolute;inset:0;background:rgba(220,40,30,.32)}
.k.on{box-shadow:inset 0 0 0 2px #fff}
.k.ultk{border-color:#ffd34d}.k.ultready{animation:ult 1s infinite alternate}
@keyframes ult{to{box-shadow:0 0 12px #ffd34d,inset 0 0 8px #ffd34d}}
.k .sw{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.68) var(--p),transparent 0)}
.k .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px "Alegreya Sans";text-shadow:0 0 3px #000}
.k .lab{position:absolute;left:2px;right:2px;bottom:1px;font:600 7px "Alegreya Sans";text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 2px #000}
.k .uf{position:absolute;left:0;bottom:0;height:3px;background:#ffd34d}
.k.pick{box-shadow:0 0 0 3px var(--acc)}

/* nameplates and combat text */
#plates{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.np{position:absolute;transform:translate(-50%,-100%);text-align:center;font:700 10px "Alegreya Sans";white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000}
.np small{display:block;font-weight:500;font-size:9px;opacity:.8}
.np .mk{display:block;font:700 18px Cinzel,serif;color:#ffd34d;line-height:1}
.np .bar{width:44px;height:4px;margin:2px auto 0}
.ft{position:absolute;transform:translate(-50%,-50%);font:700 14px "Alegreya Sans";text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.ft.big{font-size:19px}

/* joystick */
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(238,228,204,.25);background:rgba(10,12,14,.25);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(238,228,204,.35)}

/* panels */
#sheet{position:fixed;inset:0;background:rgba(6,8,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheetIn{width:min(560px,100%);max-height:86%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;padding:10px 12px calc(var(--sb) + 8px);background:#161b1f;border:1px solid var(--line)}
@media(min-aspect-ratio:4/3){#sheet{align-items:center}#sheetIn{border-radius:14px;max-height:94%}}
#sheetHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sheetHead h2{flex:1;margin:0;font:700 17px Cinzel,serif;color:var(--acc)}
#sheetBody{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.tabs button{flex:1;padding:0 4px;min-height:34px;font-size:12.5px}.tabs button.on{background:var(--acc);color:#1a1208}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:rgba(255,255,255,.03)}
.card h3{margin:0 0 3px;font:700 14px Cinzel,serif}
.card p{margin:3px 0;color:var(--dim);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.acts button{min-height:32px;padding:0 10px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.it{border-left:4px solid var(--c)}.it b{color:var(--c)}.it .st{font-size:12px;color:var(--ink);margin-top:2px}.it .st span{margin-right:8px}
.up{color:var(--good)}.down{color:var(--bad)}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}.stat span:first-child{color:var(--dim)}
.cls{display:flex;gap:8px;align-items:center}.cls .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;background:color-mix(in srgb,var(--c) 30%,#111);border:1px solid var(--c)}
.cls.on{box-shadow:0 0 0 2px var(--acc)}
.sp{display:flex;gap:8px;align-items:flex-start}.sp .ic{font-size:22px;width:34px;text-align:center}.sp.lock{opacity:.45}
.sp small{color:var(--acc);font-weight:700}
#log{font-size:12.5px;line-height:1.35}
.who{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}.who>div{flex:1}.who small{color:var(--dim)}
.who button{min-height:30px;font-size:12px;padding:0 8px}
textarea{width:100%;height:90px;background:#0e1214;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:12px monospace;padding:6px}
input[type=text]{width:100%;background:#0e1214;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:16px "Alegreya Sans";padding:8px 10px}

/* title and death */
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(8,10,14,.3),rgba(8,10,14,.85));z-index:30;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 10px)}
#titleIn{width:min(520px,100%);max-height:100%;overflow:auto;touch-action:pan-y;text-align:center}
#titleIn h1{font:700 30px/1.05 Cinzel,serif;margin:0;color:var(--acc);text-shadow:0 2px 12px rgba(0,0,0,.6)}
#titleIn .sub{color:var(--dim);margin:6px 0 14px;font-style:italic}
.clsPick{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.clsPick .card{cursor:pointer;margin:0;padding:6px 8px}.clsPick .card.on{box-shadow:0 0 0 2px var(--acc)}
.clsPick .card p{font-size:11.5px;line-height:1.25;margin:2px 0 0}
#death{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,6,6,.45);z-index:15}
#death .plate{padding:16px 18px;text-align:center;width:min(320px,90%)}
#death h2{margin:0 0 6px;font:700 22px Cinzel,serif;color:var(--bad)}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:700 22px Cinzel,serif;color:var(--acc);text-shadow:0 2px 8px #000;pointer-events:none;text-align:center;transition:opacity .6s;opacity:0}
#tip{position:fixed;z-index:25;max-width:240px;padding:7px 9px;font-size:12.5px;pointer-events:none}
#tip b{color:var(--acc)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 18px Cinzel,serif;color:var(--acc);background:var(--bg);z-index:40}
</style>
</head>
<body>
<div id="load">Loading the world…</div>
<div id="vig"></div><div id="hurt"></div>
<div id="plates"></div>
<div id="joy"><i></i></div>

<div id="hud" class="hide">
  <div id="me" class="plate">
    <div class="fname"><b id="meName">Hero</b><small id="meLvl">1</small></div>
    <div class="bar tall"><i id="meHp" style="background:var(--hp)"></i><span id="meHpT"></span></div>
    <div class="bar"><i id="meRes"></i><span id="meResT"></span></div>
    <div id="buffs"></div>
  </div>
  <div id="party"></div>
  <div id="mapbox">
    <canvas id="mini" width="192" height="192"></canvas>
    <div id="zone"></div>
    <div id="mapbtns"><button id="bookBtn">Book</button><button id="menuBtn">☰</button></div>
  </div>
  <div id="tgt" class="plate hide">
    <button id="tgtX" title="Clear target">✕</button>
    <div class="fname"><b id="tgtName"></b><small id="tgtLvl"></small></div>
    <div class="bar tall"><i id="tgtHp" style="background:var(--hp)"></i><span id="tgtHpT"></span></div>
    <div class="bar thin hide" id="tgtResW"><i id="tgtRes"></i></div>
    <div id="tgtSub"><span id="tgtInfo"></span><span id="tgtWeak"></span></div>
    <div class="bar hide" id="tgtCast"><i></i><span></span></div>
    <div id="tot"></div>
    <div id="tgtBtns"></div>
    <div id="threat"></div>
  </div>
  <div id="track"></div>
  <div id="chat"></div>
  <div id="castbar" class="plate hide"><span id="castName"></span><div class="bar"><i id="castFill"></i></div></div>
  <button id="act" class="hide"></button>
  <div id="breath" class="hide"><i></i><span>Breath</span></div>
  <div id="util">
    <button id="sitBtn" title="Sit to rest">🪑</button>
    <button id="hpotBtn" title="Healing Draught">🧪<small id="hpotN">0</small></button>
    <button id="mpotBtn" title="Clarity Draught">💧<small id="mpotN">0</small></button>
  </div>
  <div id="xp" class="bar thin"><i id="xpFill"></i></div>
  <div id="hot"><button id="cycle" title="Next target">🎯<small>Target</small></button><div id="keys"></div></div>
</div>

<div id="death" class="hide"><div class="plate"><h2>You have died</h2><p id="deathTxt" class="dim"></p><div class="acts" style="justify-content:center"><button id="releaseBtn" class="pri">Release to bind stone</button></div></div></div>
<div id="sheet" class="hide"><div id="sheetIn"><div id="sheetHead"><h2 id="sheetTitle"></h2><button id="sheetX">Close</button></div><div id="sheetBody"></div></div></div>
<div id="title" class="hide"><div id="titleIn"></div></div>
<div id="toast"></div>
<div id="tip" class="plate hide"></div>
<script type="module" src="js/main.js"></script>
</body></html>
