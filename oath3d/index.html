<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oath of the East 3D</title>
<meta name="apple-mobile-web-app-title" content="Oath 3D">
<meta name="theme-color" content="#0b0a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--ink:#ece6d8;--dim:#a39c8e;--gold:#e2ba6e;
  --st:max(8px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom));--sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));
  --k:clamp(42px,12.5vh,58px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;outline:none}
#splash,#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:radial-gradient(700px 400px at 50% 30%,#2a1f3a 0%,#0b0a10 70%)}
#splash h1{font-size:clamp(26px,6vw,44px);margin:0;letter-spacing:.05em;color:var(--gold);font-weight:700}
#splash p{margin:0;color:var(--dim);max-width:30em}
#track{width:min(320px,70vw);height:6px;border-radius:3px;background:#2a2633;overflow:hidden}
#bar{height:100%;width:0;background:var(--gold);transition:width .15s}
#msg{display:none;white-space:pre-wrap;z-index:30;font-size:17px}
#turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b0a10ee;z-index:20;font-size:19px}
@media (orientation:portrait) and (pointer:coarse){#turn{display:flex}}

#pad{position:fixed;inset:0;display:none;pointer-events:none;z-index:10}
#pad.on{display:block}
#pad>*{pointer-events:auto;position:absolute;touch-action:none}
#look{right:0;top:0;bottom:0;width:58%}
#stick{left:calc(var(--sl) + 4px);bottom:calc(var(--sb) + 4px);width:calc(var(--k)*2.4);height:calc(var(--k)*2.4);border-radius:50%;
  background:radial-gradient(circle,#ffffff14 0%,#ffffff0a 60%,#ffffff22 62%,#ffffff05 100%);border:1px solid #ffffff30}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:#ffffff3a;border:1px solid #ffffff66;pointer-events:none}
.b{width:var(--k);height:var(--k);border-radius:50%;background:#0b0a1055;border:1.5px solid #ffffff4d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:700 calc(var(--k)*.34)/1 system-ui,sans-serif;text-shadow:0 1px 2px #000}
.b small{font:600 calc(var(--k)*.17)/1.1 system-ui,sans-serif;opacity:.85;margin-top:2px;letter-spacing:.02em}
.b.held{background:#e2ba6e88;border-color:#fff}
.b.sm{width:calc(var(--k)*.92);height:calc(var(--k)*.92);font-size:calc(var(--k)*.2)}
.b.sm small{font-size:calc(var(--k)*.17)}
/* the four face buttons, laid out like a controller's: Y on top, X left, B right, A below */
#bA{right:calc(var(--sr) + var(--k)*1.08);bottom:calc(var(--sb) + 2px)}
#bB{right:calc(var(--sr) + 2px);bottom:calc(var(--sb) + var(--k)*.9)}
#bX{right:calc(var(--sr) + var(--k)*2.16);bottom:calc(var(--sb) + var(--k)*.9)}
#bY{right:calc(var(--sr) + var(--k)*1.08);bottom:calc(var(--sb) + var(--k)*1.8)}
#bR{right:calc(var(--sr) + 2px);bottom:calc(var(--sb) + var(--k)*2.2)}
#bL{right:calc(var(--sr) + 2px);bottom:calc(var(--sb) + var(--k)*3.4)}
#bS{left:calc(var(--sl) + 2px);top:calc(var(--st) + 2px)}
#bT{left:calc(var(--sl) + 2px);top:calc(var(--st) + var(--k)*1.05)}
</style>
</head><body>
<canvas id="c" tabindex="0"></canvas>
<div id="pad">
  <div id="look"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="b" id="bA" data-b="CROSS">A<small>jump</small></div>
  <div class="b" id="bB" data-b="CIRCLE">B<small>cast</small></div>
  <div class="b" id="bX" data-b="SQUARE">X<small>sprint</small></div>
  <div class="b" id="bY" data-b="TRIANGLE">Y<small>use</small></div>
  <div class="b" id="bR" data-b="R">RB<small>attack</small></div>
  <div class="b" id="bL" data-b="L">LB<small>lock</small></div>
  <div class="b sm" id="bS" data-b="START">Start<small>journal</small></div>
  <div class="b sm" id="bT" data-b="SELECT">Back<small>sneak</small></div>
</div>
<div id="turn">Turn your phone sideways to play.</div>
<div id="splash">
  <h1>Oath of the East 3D</h1>
  <p>Fetching the world (about 11 MB, once)&hellip;</p>
  <div id="track"><div id="bar"></div></div>
  <p style="font-size:14px">Touch: left stick moves, drag the right side to look. Keyboard: W A S D, mouse, Space, E, Q, F, Tab, Esc.</p>
</div>
<div id="msg"></div>
<script>window.OATH_BUILD = "v0.39-web1";</script>
<script src="oath.js?v=0.39-web1"></script>
</body></html>
